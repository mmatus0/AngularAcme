<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card shadow" style="width: 420px;">
    <div class="card-body p-4">

      <h3 class="text-center mb-4">
        <i class="bi bi-lock-fill me-2"></i>Nueva Contraseña
      </h3>

      @if (exito()) {
        <div class="alert alert-success text-center">
          <i class="bi bi-check-circle-fill me-2"></i>
          ¡Contraseña actualizada! Redirigiendo al login...
        </div>
      } @else {
        @if (error()) {
          <div class="alert alert-danger py-2">{{ error() }}</div>
        }

        <form [formGroup]="form" (ngSubmit)="resetear()">
          <div class="mb-3">
            <label class="form-label">Nueva Contraseña</label>
            <input type="password" class="form-control" formControlName="nuevaPassword" placeholder="••••••••">
            @if (form.get('nuevaPassword')?.invalid && form.get('nuevaPassword')?.touched) {
              <small class="text-danger">Mínimo 4 caracteres</small>
            }
          </div>

          <div class="mb-3">
            <label class="form-label">Confirmar Contraseña</label>
            <input type="password" class="form-control" formControlName="confirmarPassword" placeholder="••••••••">
          </div>

          <button type="submit" class="btn btn-primary w-100" [disabled]="form.invalid || loading()">
            @if (loading()) {
              <span class="spinner-border spinner-border-sm me-2"></span>
            }
            Restablecer Contraseña
          </button>
        </form>
      }

    </div>
  </div>
</div>
